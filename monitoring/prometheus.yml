global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "obesity-model"
    metrics_path: /monitoring/prometheus/metrics
    scheme: https
    static_configs:
      # Domain layanan TF Serving di Railway (tanpa "https://" dan tanpa path)
      - targets: ["obesity-model-serving-production.up.railway.app"]
