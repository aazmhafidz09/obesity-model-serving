    metrics_path: /monitoring/prometheus/metrics
    scheme: https
    static_configs:
      # TODO: ganti dengan domain layanan TF Serving Anda di Railway
      # (tanpa "https://" dan tanpa path), contoh: obesity-model.up.railway.app
      - targets: ["GANTI-DENGAN-DOMAIN-SERVING.up.railway.app"]
